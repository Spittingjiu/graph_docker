services:
  ms_graph_docker:
    build: .
    image: graph_docker:local
    container_name: ms_graph_docker
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./token.txt:/app/token.txt
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
